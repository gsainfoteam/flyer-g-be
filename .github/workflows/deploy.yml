name: Deploy

# main에 머지되면 이미지를 빌드해서 ECR에 올리고 ECS를 새 버전으로 교체한다.
on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능하게

permissions:
  id-token: write # AWS OIDC 토큰 발급에 필요 (액세스 키 없이 인증)
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: flyer-g-be
  ECS_CLUSTER: CHANGE_ME # 인프라팀에서 받은 클러스터 이름
  ECS_SERVICE: CHANGE_ME # 인프라팀에서 받은 서비스 이름

jobs:
  deploy:
    name: Build & Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 액세스 키를 쓰지 않고, "이 레포의 main 브랜치"만 맡을 수 있는
      # IAM Role을 잠깐 빌려서 인증한다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 이미지 태그를 커밋 해시로 단다.
      # 어떤 커밋이 배포됐는지 추적 가능하고, 롤백할 때 그 태그를 지정하면 된다.
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
