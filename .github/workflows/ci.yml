name: CI

# PR을 올리거나 main에 push될 때마다 자동으로 검사한다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Lint & Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # --frozen-lockfile: bun.lock에 적힌 버전 그대로만 설치한다.
      # (버전이 멋대로 올라가지 않아서 CI에 적합)
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
