name: CI

# PR을 올리거나 main에 push될 때마다 자동으로 검사한다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Lint & Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # --frozen-lockfile: bun.lock에 적힌 버전 그대로만 설치한다.
      # (버전이 멋대로 올라가지 않아서 CI에 적합)
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 영상 처리 단위 테스트(src/assets/video-processor.spec.ts)가 ffmpeg로 테스트 영상을 만든다.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
